plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.minqian.umeng'
version = '0.1.0'

android {
  namespace "com.minqian.umeng"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles 'proguard-rules.pro'
  }
  lintOptions {
    abortOnError false
  }
}

repositories {
  maven { url 'https://maven.aliyun.com/repository/public' }
  maven { url 'https://repo1.maven.org/maven2/' }
  mavenCentral()
}

dependencies {
  // Umeng common SDK + the asms native bridge.
  // - common 9.4.0: long-standing stable release, widely used in production.
  // - asms is bumped to 1.6.3 (paired with the 9.4.x common line, modern JNI
  //   surface). NOTE: no asms release (1.2.3 / 1.6.3 / 1.8.7.2 all checked)
  //   ships an x86_64 libumeng-spy.so — Umeng's matrix is armeabi-v7a +
  //   arm64-v8a + x86 only. Real-device testing should use an arm64 phone;
  //   an x86_64 emulator will fail to load the native lib at init.
  implementation 'com.umeng.umsdk:common:9.4.0'
  implementation 'com.umeng.umsdk:asms:1.6.3'
}
